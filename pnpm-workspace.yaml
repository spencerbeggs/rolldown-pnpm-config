autoInstallPeers: true
configDependencies:
  "@effected/pnpm-plugin-effected": 0.26.3
  "@savvy-web/pnpm-plugin-silk": 0.54.0
minimumReleaseAgeExclude:
  - "@effected/pnpm-plugin-effected"
  - "@savvy-web/pnpm-plugin-silk"
nodeOptions: --import=tsx
overrides:
  tsdown>rolldown-plugin-dts: ^0.29.0
packages:
  - examples/*
  - package
permissions:
  tsdown:
    skills: true
skills:
  dirs:
    - .claude/skills
